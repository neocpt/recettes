<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nos recettes</title>
<meta name="theme-color" content="#fff8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recettes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header class="hero">
  <div class="hero-row">
    <div>
      <p class="hello" id="hello">Salut 👋</p>
      <h1>Qu'est-ce qu'on<br><em>mange</em> ce soir&nbsp;?</h1>
    </div>
    <button id="btnSettings" class="round-btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<div class="sticky">
  <label class="fridge" for="ingInput">
    <svg class="fridge-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span id="chips" class="chips"></span>
    <input id="ingInput" list="ingList" placeholder="Ce que j'ai dans le frigo…" autocomplete="off" enterkeyhint="done">
    <datalist id="ingList"></datalist>
  </label>
  <nav class="filters" aria-label="Filtres">
    <div class="scroller" id="fType"></div>
    <div class="scroller" id="fMore"></div>
  </nav>
</div>

<div id="pending" class="pending" hidden></div>
<main id="results"></main>

<button id="btnRandom" class="fab" aria-label="Une recette au hasard"><span class="dice">🎲</span>Au hasard</button>

<!-- Fiche recette (plein écran) -->
<dialog id="dlgRecipe" class="sheet full"><div id="recipeBody"></div></dialog>

<!-- Modification -->
<dialog id="dlgEdit" class="sheet">
  <form id="editForm" method="dialog">
    <div class="sheet-head"><button type="button" class="link-btn" data-close>Annuler</button><h2>Modifier</h2><button type="submit" class="link-btn strong">OK</button></div>
    <label>Titre <input name="titre" required></label>
    <div class="row">
      <label>Temps (min) <input name="temps_min" type="number" min="0" inputmode="numeric"></label>
      <label>Type <select name="type"></select></label>
    </div>
    <label>Ingrédients <small>un par ligne</small><textarea name="ingredients" rows="8"></textarea></label>
    <label>Étapes <small>une par ligne</small><textarea name="etapes" rows="8"></textarea></label>
  </form>
</dialog>

<!-- Réglages -->
<dialog id="dlgSettings" class="sheet">
  <form id="settingsForm" method="dialog">
    <div class="sheet-head"><button type="button" class="link-btn" data-close>Fermer</button><h2>Réglages</h2><button type="submit" class="link-btn strong">OK</button></div>
    <div class="card-group">
      <label>Ton prénom <input name="prenom" required autocomplete="given-name"></label>
      <label>Code d'accès <small>reste sur ce téléphone</small><input name="token" type="password" autocomplete="off" spellcheck="false"></label>
      <label>Basiques ignorés dans la recherche <small>séparés par des virgules</small><input name="basiques"></label>
    </div>
  </form>
  <div class="card-group">
    <h3>Importer d'un coup</h3>
    <p class="small">Export Instagram ou TikTok (.zip), voir le guide.</p>
    <label class="file-btn">Choisir le fichier d'export<input id="importFile" type="file" accept=".zip,.json,.html,application/zip,application/json,text/html"></label>
    <div id="importResult"></div>
  </div>
  <div class="card-group">
    <h3>Ajouter un lien à la main</h3>
    <div class="row"><input id="manualUrl" type="url" placeholder="https://www.instagram.com/reel/…"><button id="btnManual" class="btn small">Ajouter</button></div>
  </div>
  <p class="small center" id="appVer"></p>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="common.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
