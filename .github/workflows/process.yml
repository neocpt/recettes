name: Analyse des recettes

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *" # filet de sécurité : réessaie les analyses en attente

permissions:
  contents: write
  issues: write

concurrency:
  group: recettes # une seule analyse à la fois ; chaque run traite TOUTES les demandes ouvertes
  cancel-in-progress: false

jobs:
  analyse:
    # seulement les demandes du propriétaire du dépôt (les autres sont ignorées)
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[recette]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet --upgrade "yt-dlp[default,curl-cffi]" requests pillow
      - name: Identité git (pour publier au fil de l'eau)
        run: |
          git config user.name "recettes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Analyse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/process.py
      - name: Enregistre
        run: |
          git add data
          if [ -d img ]; then git add img; fi
          if ! git diff --cached --quiet; then
            git commit -m "Recettes mises à jour"
            git pull --rebase
            git push
          fi
      - name: Ferme les demandes traitées
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/process.py --close-issues
