<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajouter une recette</title>
<meta name="theme-color" content="#e8693c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=1">
<style>
  .share { max-width: 480px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 20px 30px; text-align: center; }
  .share .big { font-size: 3.2rem; }
  .share h1 { font-size: 1.3rem; margin: 10px 0; }
  .share p { color: var(--muted); }
  .share form { display: grid; gap: 10px; text-align: left; margin-top: 16px; }
  .share label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
  .share input { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); }
  .share a.primary { display: inline-block; margin-top: 18px; text-decoration: none; }
</style>
</head>
<body>
<div class="share" id="box"><div class="big">⏳</div><h1>Envoi…</h1></div>
<script src="common.js?v=3"></script>
<script>
'use strict';
const box = document.getElementById('box');
const p = new URLSearchParams(location.search);
const shared = [p.get('url'), p.get('text'), p.get('title')].join(' ');
const urls = findVideoUrls(shared);

function show(icon, title, text, extra = '') {
  box.innerHTML = `<div class="big">${icon}</div><h1>${title}</h1><p>${text}</p>${extra}<a class="primary" href="./">Voir nos recettes</a>`;
}

async function send() {
  if (!urls.length) {
    show('🤔', 'Lien non reconnu', `Je n'ai pas trouvé de lien Instagram ou TikTok dans ce partage.<br><small>${esc(shared.trim()).slice(0, 200)}</small>`);
    return;
  }
  const c = cfg();
  if (!c.prenom || !c.token) { // premier partage sur ce téléphone : on demande les infos une seule fois
    box.innerHTML = `<div class="big">👋</div><h1>Première fois ici</h1><p>Ces infos restent sur ce téléphone.</p>
      <form id="f"><label>Ton prénom<input name="prenom" required value="${esc(c.prenom)}"></label>
      <label>Code d'accès<input name="token" type="password" required value="${esc(c.token)}"></label>
      <button class="primary">Ajouter la recette</button></form>`;
    document.getElementById('f').onsubmit = (e) => {
      e.preventDefault();
      saveCfg({ prenom: e.target.prenom.value.trim(), token: cleanToken(e.target.token.value) });
      send();
    };
    return;
  }
  try {
    await addUrls(urls, c.prenom);
    show('✅', 'Recette ajoutée !', "L'analyse de la vidéo prend environ 2 minutes.<br>Tu peux retourner sur Instagram/TikTok.");
  } catch (e) {
    show('⚠️', "Pas envoyée", esc(e.message), '<p><button class="ghost" onclick="location.reload()">Réessayer</button></p>');
  }
}
send();
</script>
</body>
</html>
